<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" width="150" height="150" role="img" aria-label="Almstins Verify — glowing shield checking a phone">
  <defs>
    <linearGradient id="vfGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cf3d0" stop-opacity=".38"/>
      <stop offset="1" stop-color="#0f9c78" stop-opacity=".14"/>
    </linearGradient>
    <linearGradient id="vfRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8fff0"/>
      <stop offset=".5" stop-color="#48e6bd"/>
      <stop offset="1" stop-color="#17b892"/>
    </linearGradient>
    <filter id="vfHalo" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="4.2"/></filter>
    <filter id="vfGlow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.1"/></filter>
  </defs>

  <!-- phone being checked -->
  <g transform="rotate(-7 75 75)">
    <rect x="47" y="20" width="56" height="108" rx="13" fill="#0a1f1b" stroke="#2fd6a8" stroke-opacity=".6" stroke-width="1.6"/>
    <rect x="52" y="28" width="46" height="92" rx="8" fill="#05201b"/>
    <rect x="67" y="32.5" width="16" height="3" rx="1.5" fill="#2fd6a8" opacity=".5"/>
    <rect x="58" y="44" width="21" height="4.5" rx="2.25" fill="#eafcf6" opacity=".22"/>
    <!-- green VERIFIED tab -->
    <rect x="57" y="56" width="41" height="15" rx="7.5" fill="#123125" stroke="#34d399" stroke-width="1.5"/>
    <circle cx="66" cy="63.5" r="4.6" fill="#34d399"/>
    <path d="M63.8 63.6 l1.6 1.7 l3.1 -3.6" fill="none" stroke="#05201b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="74" y="61.4" width="19" height="4.2" rx="2.1" fill="#34d399" opacity=".9"/>
    <!-- content rows -->
    <rect x="58" y="82" width="40" height="3.8" rx="1.9" fill="#eafcf6" opacity=".16"/>
    <rect x="58" y="90.5" width="31" height="3.8" rx="1.9" fill="#eafcf6" opacity=".16"/>
    <rect x="58" y="99" width="36" height="3.8" rx="1.9" fill="#eafcf6" opacity=".16"/>
    <rect x="67" y="112" width="16" height="3" rx="1.5" fill="#eafcf6" opacity=".28"/>
  </g>

  <!-- translucent glass shield hovering in front -->
  <g transform="translate(74 4) scale(.6)">
    <path filter="url(#vfHalo)" fill="#31e6b2" opacity=".4" d="M48 8 L82 20 V47 C82 66 68 80.5 48 91 C28 80.5 14 66 14 47 V20 Z"/>
    <path fill="url(#vfGlass)" d="M48 8 L82 20 V47 C82 66 68 80.5 48 91 C28 80.5 14 66 14 47 V20 Z"/>
    <path filter="url(#vfGlow)" fill="none" stroke="url(#vfRim)" stroke-width="3.2" stroke-linejoin="round" d="M48 8 L82 20 V47 C82 66 68 80.5 48 91 C28 80.5 14 66 14 47 V20 Z"/>
    <path filter="url(#vfGlow)" d="M34.5 50 l9 9 l19.5 -22.5" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
