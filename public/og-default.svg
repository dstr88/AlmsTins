<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Dark background gradient -->
    <radialGradient id="bg" cx="30%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#0c1224"/>
      <stop offset="100%" stop-color="#05070f"/>
    </radialGradient>
    <!-- Purple glow for accent elements -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5767ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#5767ff" stop-opacity="0"/>
    </radialGradient>
    <!-- Wordmark gradient -->
    <linearGradient id="wordmark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f8ff"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
    <!-- CTA button gradient -->
    <linearGradient id="btn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5767ff"/>
      <stop offset="100%" stop-color="#934dff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle glow blob top-left -->
  <ellipse cx="200" cy="180" rx="320" ry="260" fill="url(#glow)"/>

  <!-- Grid lines (subtle) -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Top border accent line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#btn)"/>

  <!-- Eyebrow pill -->
  <rect x="80" y="120" width="280" height="36" rx="18" fill="rgba(87,103,255,0.15)" stroke="rgba(87,103,255,0.35)" stroke-width="1"/>
  <text x="220" y="143" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#a5b4fc" text-anchor="middle" letter-spacing="2">CRYPTO · PORTFOLIO · TAX</text>

  <!-- Wordmark -->
  <text x="80" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="96" font-weight="800" fill="url(#wordmark)" letter-spacing="-3">Almstins</text>

  <!-- Tagline -->
  <text x="80" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="rgba(255,255,255,0.5)">Track wallets · Calculate gains · Export tax reports</text>

  <!-- Feature pills row -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">
    <!-- Pill 1 -->
    <rect x="80" y="390" width="188" height="38" rx="19" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="174" y="414" fill="rgba(255,255,255,0.7)" text-anchor="middle">📊 Portfolio Tracker</text>
    <!-- Pill 2 -->
    <rect x="284" y="390" width="160" height="38" rx="19" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="364" y="414" fill="rgba(255,255,255,0.7)" text-anchor="middle">🏦 DeFi Positions</text>
    <!-- Pill 3 -->
    <rect x="460" y="390" width="168" height="38" rx="19" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="544" y="414" fill="rgba(255,255,255,0.7)" text-anchor="middle">📄 Form 8949 Export</text>
    <!-- Pill 4 -->
    <rect x="644" y="390" width="162" height="38" rx="19" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="725" y="414" fill="rgba(255,255,255,0.7)" text-anchor="middle">🔍 Scam Checker</text>
  </g>

  <!-- CTA button -->
  <rect x="80" y="470" width="220" height="52" rx="26" fill="url(#btn)"/>
  <text x="190" y="502" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Get started free →</text>

  <!-- Domain badge -->
  <text x="80" y="574" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.3)" letter-spacing="1">almstins.com</text>

  <!-- Right-side decorative chart bars -->
  <g opacity="0.18">
    <rect x="880" y="420" width="40" height="120" rx="6" fill="#5767ff"/>
    <rect x="934" y="350" width="40" height="190" rx="6" fill="#6a78ff"/>
    <rect x="988" y="290" width="40" height="250" rx="6" fill="#7d8fff"/>
    <rect x="1042" y="370" width="40" height="170" rx="6" fill="#934dff"/>
    <rect x="1096" y="310" width="40" height="230" rx="6" fill="#a560ff"/>
  </g>
  <!-- Chart line overlay -->
  <polyline points="900,400 954,330 1008,270 1062,350 1116,290" fill="none" stroke="rgba(165,180,252,0.4)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Chart dots -->
  <g fill="#a5b4fc" opacity="0.6">
    <circle cx="900" cy="400" r="5"/>
    <circle cx="954" cy="330" r="5"/>
    <circle cx="1008" cy="270" r="5"/>
    <circle cx="1062" cy="350" r="5"/>
    <circle cx="1116" cy="290" r="5"/>
  </g>
</svg>
