name: Verify Monitor

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

jobs:
  verify-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger verify-monitor
        env:
          SYNC_URL:    ${{ secrets.SYNC_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SYNC_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SYNC_URL or CRON_SECRET secret missing."
            exit 1
          fi
          curl -sS --fail --retry 4 --retry-all-errors --retry-delay 15 --retry-max-time 120 --connect-timeout 20 --max-time 600 \
            "$SYNC_URL/api/cron/verify-monitor?secret=$CRON_SECRET" \
            -H "x-cron-secret: $CRON_SECRET"
