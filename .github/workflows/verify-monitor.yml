name: Verify Monitor

on:
  schedule:
    # Every 6 hours — keeps the verified-address mirror fresh and detects
    # revocations / swapped proofs well within the 24h max-stale TTL.
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  verify-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Verify re-validation watchman
        env:
          SYNC_URL:    ${{ secrets.SYNC_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SYNC_URL" ]; then
            echo "SYNC_URL secret missing."
            exit 1
          fi
          curl -sS --fail \
            "$SYNC_URL/api/cron/verify-monitor?secret=$CRON_SECRET" \
            -H "x-cron-secret: $CRON_SECRET"
