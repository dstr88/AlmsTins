name: Playwright E2E Tests

on:
  push:
    branches: [production]
  schedule:
    # Also runs every 6 hours to catch anything that broke in production
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  test:
    name: E2E Tests
    # Pinned: ubuntu-latest moved to Ubuntu 26.04 on 2026-11-06, and Playwright 1.58.2 cannot install
    # Chromium's system dependencies there ("does not support chromium on ubuntu26.04-x64"). Move back to
    # ubuntu-latest once Playwright is upgraded to a release that supports 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The browser itself comes from Playwright's own servers. Three tries, 30 seconds apart.
      - name: Install Playwright browsers
        run: |
          for attempt in 1 2 3; do
            if npx playwright install chromium; then exit 0; fi
            echo "Browser install failed (attempt $attempt of 3)."
            if [ "$attempt" -lt 3 ]; then sleep 30; fi
          done
          exit 1

      # Chromium's system packages come from Ubuntu's mirrors, a separate download that apt retries on
      # its own. In run 189 (2026-11-11) the runner could not resolve the mirrors for ten minutes
      # ("Temporary failure resolving 'azure.archive.ubuntu.com'"), the install failed and no test ran.
      # The runner image already holds Chromium's libraries (that run was missing nine font packages
      # and nothing else), so a failure here is a warning and the tests still run.
      - name: Install Chromium's system packages
        run: |
          if ! npx playwright install-deps chromium; then
            echo "::warning::Chromium's system packages could not be installed. The tests run on the libraries the runner already has."
          fi

      # On a push-triggered run, give Render ~90 seconds to finish deploying
      # before we hit the live URL. Adjust if your build takes longer.
      - name: Wait for Render deployment
        if: github.event_name == 'push'
        run: |
          echo "Waiting 90s for Render to deploy..."
          sleep 90

      - name: Run Playwright tests
        env:
          BASE_URL:      ${{ secrets.E2E_BASE_URL }}
          E2E_EMAIL:     ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD:  ${{ secrets.E2E_PASSWORD }}
        run: npx playwright test

      # Upload screenshots + traces when tests fail so you can see exactly
      # what the browser saw.
      - name: Upload test report on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
