name: Agent Reports

# Daily: the Agent Vault makes yesterday's operator report for every agent that did anything, and
# emails the accounts that turned a digest on. Runs after the chain watcher (Sync Agent Wallets,
# 08:10 UTC, which stops starting new reads after nine minutes) so a transfer is in the ledger
# before the day's report is made.
on:
  schedule:
    - cron: '10 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-reports:
    runs-on: ubuntu-latest
    steps:
      # Only the curl wrapper. It retries a request that never reached the server, nothing else.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/cron-curl.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Trigger agent-reports
        env:
          SYNC_URL:    ${{ secrets.SYNC_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SYNC_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SYNC_URL or CRON_SECRET secret missing."
            exit 1
          fi
          bash scripts/cron-curl.sh -sS --fail --max-time 600 \
            -o "$RUNNER_TEMP/cron-response.json" -w 'HTTP %{http_code}\n' \
            "$SYNC_URL/api/cron/agent-reports?secret=$CRON_SECRET" \
            -H "x-cron-secret: $CRON_SECRET"
          # Print only numbers and true/false fields (counts, ok). This repo's Actions logs are public.
          jq -c 'with_entries(select(.value | type == "number" or type == "boolean"))' "$RUNNER_TEMP/cron-response.json" 2>/dev/null || echo "(response was not JSON)"
