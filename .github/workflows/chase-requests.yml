name: Chase Requests

# Daily: chase confirmation requests about to expire, and write down the ones that
# expired unanswered. Silence used to leave no record at all, not even that we asked.
on:
  schedule:
    - cron: '20 9 * * *'
  workflow_dispatch:

jobs:
  chase-requests:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger chase-requests
        env:
          SYNC_URL:    ${{ secrets.SYNC_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SYNC_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SYNC_URL or CRON_SECRET secret missing."
            exit 1
          fi
          curl -sS --fail --max-time 600 \
            -o "$RUNNER_TEMP/cron-response.json" -w 'HTTP %{http_code}\n' \
            "$SYNC_URL/api/cron/chase-requests?secret=$CRON_SECRET" \
            -H "x-cron-secret: $CRON_SECRET"
          # Print only numbers and true/false fields (counts, ok). The full response names wallets and
          # accounts, and this repo's Actions logs are public.
          jq -c 'with_entries(select(.value | type == "number" or type == "boolean"))' "$RUNNER_TEMP/cron-response.json" 2>/dev/null || echo "(response was not JSON)"
