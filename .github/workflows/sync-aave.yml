name: Sync Aave

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  sync-aave:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync-aave
        env:
          SYNC_URL:    ${{ secrets.SYNC_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SYNC_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SYNC_URL or CRON_SECRET secret missing."
            exit 1
          fi
          curl -sS --fail --max-time 1800 \
            "$SYNC_URL/api/cron/sync-aave?secret=$CRON_SECRET" \
            -H "x-cron-secret: $CRON_SECRET"
