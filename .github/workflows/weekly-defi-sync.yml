name: Weekly DeFi Sync

on:
  schedule:
    - cron: '0 2 * * 6'
  workflow_dispatch:

jobs:
  defi-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger DeFi sync
        env:
          SYNC_URL: ${{ secrets.SYNC_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_URL" ]; then
            echo "SYNC_URL secret missing."
            exit 1
          fi
          curl -sS -X POST "$SYNC_URL/api/sync/defi" \
            -H "Content-Type: application/json" \
            -H "x-sync-token: $SYNC_TOKEN" \
            -d '{"mode":"full"}'
