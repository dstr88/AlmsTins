name: Weekly DeFi Sync

# Backup for the Render `sync-aave` cron: if Render's scheduler fails to fire, this
# weekly GitHub Actions job hits /api/cron/sync-defi (same logic) so DeFi data still
# refreshes. Runs Saturdays; the Render cron runs Mondays — the sync logic's 6-day
# staleness skip keeps them from doing duplicate work.
on:
  schedule:
    - cron: '0 2 * * 6'
  workflow_dispatch:

jobs:
  defi-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger DeFi sync (backup for Render sync-aave)
        env:
          SYNC_URL: ${{ secrets.SYNC_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SYNC_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SYNC_URL or CRON_SECRET secret missing."
            exit 1
          fi
          curl -sS --fail \
            -o "$RUNNER_TEMP/cron-response.json" -w 'HTTP %{http_code}\n' \
            "$SYNC_URL/api/cron/sync-defi?secret=$CRON_SECRET" \
            -H "x-cron-secret: $CRON_SECRET"
          # Print only numbers and true/false fields (counts, ok). The full response names wallets and
          # accounts, and this repo's Actions logs are public.
          jq -c 'with_entries(select(.value | type == "number" or type == "boolean"))' "$RUNNER_TEMP/cron-response.json" 2>/dev/null || echo "(response was not JSON)"
